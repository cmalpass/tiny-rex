stages:
  - lint
  - typecheck
  - test
  - build

default:
  image: node:22-bookworm
  tags:
    - node

lint:
  stage: lint
  script:
    - npm ci
    - npm run lint || echo "Lint warnings reviewed"

typecheck:
  stage: typecheck
  script:
    - npm ci
    - npm run typecheck

test:
  stage: test
  script:
    - npm ci
    - npm run test

bundle_game:
  stage: build
  script:
    - npm run build
  artifacts:
    name: "tiny-rex-web-game"
    paths:
      - dist/
    expire_in: 30 days
