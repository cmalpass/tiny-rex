<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Tiny Rex: Crystal Valley — a cheerful original 2D platformer. All art and sound generated procedurally in the browser.">
  <title>Tiny Rex: Crystal Valley</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%233fa34d'/%3E%3Ccircle cx='24' cy='28' r='7' fill='white'/%3E%3Ccircle cx='40' cy='28' r='7' fill='white'/%3E%3Ccircle cx='26' cy='30' r='3.5' fill='%23222'/%3E%3Ccircle cx='42' cy='30' r='3.5' fill='%23222'/%3E%3Cellipse cx='32' cy='46' rx='12' ry='8' fill='%23fff3d6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Tiny Rex: Crystal Valley game"></canvas>
    <button id="pauseBtn" type="button" class="hud-btn" aria-label="Pause or resume game" title="Pause (P)">⏸</button>
    <button id="muteBtn" type="button" class="hud-btn" aria-label="Toggle sound" title="Toggle sound (M)">🔊</button>

    <div id="touch-controls" aria-hidden="true">
      <div class="tc-cluster">
        <button id="btn-left" type="button" class="tc-btn" aria-label="Move left">◀</button>
        <button id="btn-right" type="button" class="tc-btn" aria-label="Move right">▶</button>
      </div>
      <button id="btn-jump" type="button" class="tc-btn tc-jump" aria-label="Jump">▲</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
